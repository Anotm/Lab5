<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Address Book</title>
</head>
<body>
<h1>Address Book #<span th:text="${addressBook.id}">1</span></h1>

<table border="1">
    <thead>
    <tr><th>Name</th><th>Phone Number</th></tr>
    </thead>
    <tbody>
    <tr th:each="buddy : ${addressBook.buddyList}">
        <td th:text="${buddy.name}">Name</td>
        <td th:text="${buddy.phoneNumber}">Phone</td>
    </tr>
    </tbody>
</table>

<h2>Add a buddy</h2>
<form id="buddy-form" th:action="@{/addressbook/{id}/buddy(id=${addressBook.id})}" method="post">
    <label>Name: <input type="text" name="name" required></label>
    <label>Phone: <input type="text" name="phoneNumber" required></label>
    <button type="submit">Add buddy</button>
</form>

<p><a th:href="@{/}">Back to all address books</a></p>

<script src="/js/app.js" defer></script>
</body>
</html>
