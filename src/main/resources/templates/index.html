<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AddressBook App</title>
</head>
<body>
<h1>AddressBook App</h1>

<h2>Address books</h2>
<table border="1">
    <thead>
    <tr><th>ID</th><th>Buddies</th></tr>
    </thead>
    <tbody>
    <tr th:each="book : ${addressBooks}">
        <td>
            <a th:href="@{/addressbook/{id}(id=${book.id})}" th:text="${book.id}">1</a>
        </td>
        <td th:text="${#lists.size(book.buddyList)}">0</td>
    </tr>
    </tbody>
</table>

<form id="create-addressbook-form" th:action="@{/addressbook}" method="post">
    <button type="submit">Create new address book</button>
</form>

<h2>REST API</h2>
<ul>
    <li><a href="/api">/api</a> (all resources)</li>
    <li><a href="/api/addressBooks">/api/addressBooks</a></li>
    <li><a href="/api/buddyInfos">/api/buddyInfos</a></li>
</ul>

<script src="/js/app.js" defer></script>
</body>
</html>
